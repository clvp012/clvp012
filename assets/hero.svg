<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050b"/><stop offset="1" stop-color="#10051b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"><animate attributeName="stop-color" values="#00eaff;#5878ff;#d74bff;#ff53c8;#00eaff" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#d74bff"><animate attributeName="stop-color" values="#d74bff;#ff53c8;#00eaff;#5878ff;#d74bff" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#5d7cff" stroke-opacity=".14" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="328" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <ellipse cx="230" cy="20" rx="260" ry="170" fill="#00dfff" opacity=".08"><animate attributeName="opacity" values=".04;.13;.04" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1000" cy="300" rx="330" ry="190" fill="#d000ff" opacity=".09"><animate attributeName="opacity" values=".04;.14;.04" dur="5.2s" repeatCount="indefinite"/></ellipse>
    <g fill="none" stroke="url(#neon)" opacity=".65">
      <circle cx="1040" cy="105" r="66" stroke-width="1.3"><animateTransform attributeName="transform" type="rotate" from="0 1040 105" to="360 1040 105" dur="28s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="105" r="85" stroke-width=".8" stroke-dasharray="8 12"><animateTransform attributeName="transform" type="rotate" from="360 1040 105" to="0 1040 105" dur="19s" repeatCount="indefinite"/></circle>
      <path d="M940 105h200M1040 5v200" opacity=".4"/>
    </g>
    <g fill="url(#neon)" filter="url(#glow)">
      <circle cx="90" cy="75" r="2.5"><animate attributeName="cy" values="75;50;75" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="255" r="2"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="235" r="2.5"><animate attributeName="cx" values="1120;1090;1120" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="45" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M0 270H1200" stroke="url(#neon)" stroke-width="1" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/></path>
    <rect x="-300" y="0" width="180" height="330" fill="url(#sweep)" opacity=".12"><animate attributeName="x" from="-300" to="1300" dur="6s" repeatCount="indefinite"/></rect>
    <text x="64" y="68" font-family="monospace" font-size="13" letter-spacing="4" fill="#76f5ff">[ INDEPENDENT DEVELOPER / DIGITAL CREATOR ]</text>
    <text x="58" y="178" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" letter-spacing="-3" fill="url(#neon)" filter="url(#glow)">CLVP012</text>
    <text x="65" y="218" font-family="monospace" font-size="17" letter-spacing="3" fill="#c8d3e8">BUILDING · EXPERIMENTING · CREATING</text>
    <g font-family="monospace" font-size="12" fill="#79f8ff"><text x="65" y="292">SYS.STATUS</text><text x="160" y="292" fill="#b9a4ff">ONLINE</text><circle cx="145" cy="288" r="4" fill="#54ffb5"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle></g>
    <text x="1135" y="292" text-anchor="end" font-family="monospace" font-size="12" fill="#8490a8">v.01 // PROFILE</text>
    <g opacity=".15"><path d="M0 0H1200V330H0Z" fill="none" stroke="#b8c7ff" stroke-width="2"/><path d="M0 7H1200M0 323H1200" stroke="#fff" stroke-width="1"/></g>
  </g>
</svg>
